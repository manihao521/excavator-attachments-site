name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate blog metadata output
        run: npm run blog:generate

      - name: Audit blog parity
        run: npm run blog:audit

      - name: Build clean deployment output
        run: npm run build

      - name: Verify article deployment assets
        shell: bash
        run: |
          test -f dist/blog/hydraulic-breaker-spare-parts-buying-guide/index.html
          test -f dist/images/blog/hydraulic-breaker-spare-parts-buying-guide.webp
          test -f dist/images/blog/hydraulic-breaker-spare-parts-overview.webp
          test -f dist/images/blog/hydraulic-breaker-core-parts.webp
          test -f dist/images/blog/hydraulic-breaker-wear-sealing-parts.webp
          test -f dist/images/blog/hydraulic-breaker-parts-quality-inspection.webp

      - name: Deploy static site to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-dirty=true
